name: CI

on:
  push:
  pull_request:

jobs:
  packages:
    name: Package tests
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [RumbleServices, RumbleState]
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Test ${{ matrix.package }}
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  app:
    name: Build app (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Rumble.xcodeproj \
            -scheme Rumble \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  proto:
    name: Proto package (generates gRPC code)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install protobuf
      - name: Build
        working-directory: Packages/RumbleProto
        run: swift build
