# Generate the Xcode project with `xcodegen generate` (brew install xcodegen).
name: Rumble
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  RumbleUI: { path: Packages/RumbleUI }
  RumbleState: { path: Packages/RumbleState }
  RumbleServices: { path: Packages/RumbleServices }
  # Add once the gRPC adapters exist: RumbleProto: { path: Packages/RumbleProto }
targets:
  Rumble:
    type: application
    platform: iOS
    sources: [Rumble]
    dependencies:
      - package: RumbleUI
      - package: RumbleState
      - package: RumbleServices
      - target: RumbleWidgets
    info:
      path: Rumble/Info.plist
      properties:
        CFBundleDisplayName: Rumble
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rumble
  RumbleWidgets:
    type: app-extension
    platform: iOS
    sources: [RumbleWidgets]
    dependencies:
      - package: RumbleServices
    info:
      path: RumbleWidgets/Info.plist
      properties:
        CFBundleDisplayName: Rumble Timers
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rumble.widgets
