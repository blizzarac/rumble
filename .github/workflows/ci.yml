name: CI

on:
  push:
  pull_request:

jobs:
  packages:
    name: Package tests
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [RumbleServices, RumbleState]
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Test ${{ matrix.package }}
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  app:
    name: Build app (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Rumble.xcodeproj \
            -scheme Rumble \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  ui-tests:
    name: UI tests (${{ matrix.device }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 16", "iPad Pro 13-inch (M4)"]
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Rumble.xcodeproj \
            -scheme Rumble \
            -destination 'platform=iOS Simulator,name=${{ matrix.device }}' \
            CODE_SIGNING_ALLOWED=NO

  proto:
    name: Proto package (generates gRPC code)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install protobuf
      - name: Build
        working-directory: Packages/RumbleProto
        # The build plugin only runs protoc from PROTOC_PATH.
        run: PROTOC_PATH=$(which protoc) swift build
      - name: Show generated API (for writing the adapters)
        if: always()
        working-directory: Packages/RumbleProto
        run: |
          for f in $(find .build -name '*.grpc.swift' | head -3); do
            echo "=== $f"
            grep -nE '^\s*(public )?(protocol|struct|extension|enum|typealias) |^\s*(public )?(static )?(func|var|let|init)\b' "$f" | grep -vE 'internal|private' | head -150
          done
          for f in $(find .build -name '*.pb.swift' | head -2); do
            echo "=== $f"
            grep -nE '^(public )?(struct|enum) ' "$f" | head -60
          done
