# Generate the Xcode project with `xcodegen generate` (brew install xcodegen).
name: Rumble
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  RumbleUI: { path: Packages/RumbleUI }
  RumbleState: { path: Packages/RumbleState }
  RumbleServices: { path: Packages/RumbleServices }
  # Add once the gRPC adapters exist: RumbleProto: { path: Packages/RumbleProto }
targets:
  Rumble:
    type: application
    platform: iOS
    sources: [Rumble]
    dependencies:
      - package: RumbleUI
      - package: RumbleState
      - package: RumbleServices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rumble
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
